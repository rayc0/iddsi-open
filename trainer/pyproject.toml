[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iddsi-open-trainer"
version = "0.1.0"
description = "Reproducible research training and evaluation harness for IDDSI-Open"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
models = ["transformers>=4.57", "timm>=1.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["train*", "eval*", "explain*", "fixtures*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
