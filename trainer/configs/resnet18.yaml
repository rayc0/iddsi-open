experiment:
  name: resnet18_coral_baseline
  output_dir: ../runs
  seeds: [17, 29, 43, 71, 101]

data:
  manifest: /path/to/physically_tested_manifest.jsonl
  image_size: 224
  batch_size: 64
  num_workers: 8
  group_field: group_id
  synthetic: false

model:
  kind: resnet18
  name: resnet18
  pretrained: true
  dropout: 0.1

training:
  device: cuda
  amp: true
  phases:
    - name: frozen_encoder_head
      epochs: 3
      lr: 0.0003
      unfreeze_last_blocks: 0
    - name: unfreeze_last_residual_stage
      epochs: 5
      lr: 0.00003
      unfreeze_last_blocks: 1

calibration:
  target_under_fnr: 0.05
  max_abstention: 0.30

evaluation:
  bootstrap_samples: 1000
  bootstrap_seed: 2026

