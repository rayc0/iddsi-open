experiment:
  name: siglip2_v07_sched2x
  # Lane exp02_schedule, VARIANT arm: the v0.7 recipe with 2x epochs per phase
  # (60 -> 120 frozen, 15 -> 30 unfrozen) and, per phase, a linear warmup over
  # the first 10% of that phase's optimizer steps followed by cosine decay to
  # zero. Data, model, loss, class-balance beta, weight decay, gradient clip,
  # seeds [17, 101], calibration and evaluation are IDENTICAL to
  # configs/siglip2_v07.yaml and to configs/exp02_schedule_control.yaml.
  output_dir: /work/lane_runs/exp02_schedule/sched2x_cosine
  seeds: [17, 101]

data:
  # v0.7: consensus derived from FULL labeller coverage.
  #
  # A coverage-closure run gave a second independent judgement to the 314 events
  # that previously carried only one, so 337 of the 532 cleaned events now have
  # two genuine independent judgements (251 unanimous, 86 split) instead of an
  # unverifiable single call. 195 events still have a single judgement and are
  # kept at weight 1: we have no evidence about their reliability, so they are
  # neither promoted nor punished.
  #
  # Cross-family agreement is stable and reproducible at ~74.5%: 251/337 = 74.5%
  # on the doubled sample, and 166/223 = 74.4% on the subset that was already
  # doubled. Two independent model families agree on an IDDSI level from a web
  # photograph about three times in four.
  #
  # Agreement weighting was tried and ABANDONED ON EVIDENCE: normalising
  # agreement within each level produced a replication factor of 1 for every
  # event, because agreement is effectively all-or-nothing inside a level rather
  # than graded. The manifest carries the agreement fields for provenance but
  # applies no replication. The improvement here is the labels themselves.
  #
  # Split is inherited verbatim from v0.3 (group-disjoint, asserted), so v0.7 is
  # comparable with v0.4/v0.5 on the same held-out events.
  manifest: /work/data/manifest_v07_weighted.jsonl
  image_size: 224
  batch_size: 32
  num_workers: 8
  group_field: group_id      # 650 groups over 684 rows, asserted group-disjoint
  synthetic: false

model:
  kind: siglip2
  name: /work/models_local/siglip2-base-patch16-224
  pretrained: true
  dropout: 0.1

training:
  # Identical to every prior version apart from the schedule itself.
  device: cuda
  amp: true
  weight_decay: 0.01
  class_balance_beta: 0.999
  gradient_clip_norm: 1.0
  # VARIANT: cosine decay with a linear warmup of 10% of the phase's steps.
  # The scheduler is scoped PER PHASE (each phase builds its own AdamW, exactly
  # as train/engine.py does), so warmup counts 10% of that phase's optimizer
  # steps and the cosine runs from the phase's peak lr down to
  # min_lr_fraction * peak_lr at the phase's last step.
  scheduler:
    type: cosine
    warmup_fraction: 0.10
    min_lr_fraction: 0.0
  phases:
    - name: frozen_encoder_head
      epochs: 120          # 2x the shipped 60
      lr: 0.001
      unfreeze_last_blocks: 0
    - name: unfreeze_last_two_blocks
      epochs: 30           # 2x the shipped 15
      lr: 0.00002
      unfreeze_last_blocks: 2

calibration:
  target_under_fnr: 0.05
  max_abstention: 0.30

evaluation:
  bootstrap_samples: 1000
  bootstrap_seed: 2026
