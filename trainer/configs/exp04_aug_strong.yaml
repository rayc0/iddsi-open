# exp04_aug / baseline — the v0.7 recipe EXACTLY AS SHIPPED.
#
# This file is a verbatim copy of configs/siglip2_v07.yaml with three edits:
# name, output_dir and seeds. Nothing about the model, the optimiser, the
# phase schedule, the manifest or the calibration is touched, and no
# data.augment key is present — so the trainer falls back to its shipped
# train-time augmentation (random horizontal flip, p=0.5, and nothing else).
#
# seeds are cut from 5 to [17, 101] per the lane brief. That makes this run
# comparable with the v0.7 per-seed numbers for seeds 17 and 101 in
# results/v07_release/v07_seed17_metrics.json and ..._seed101_metrics.json.
# exp04_aug / strong — the SAME v0.7 recipe with stronger photometric
# augmentation. This file differs from configs/exp04_aug_baseline.yaml in
# exactly two places: output_dir/name, and the data.augment block below. The
# model, optimiser, phase schedule, manifest and calibration are byte-identical,
# so any difference in kappa is attributable to augmentation and nothing else.
experiment:
  name: exp04_aug_strong
  output_dir: /work/lane_runs/exp04_aug/strong_photometric
  seeds: [17, 101]

data:
  # v0.7: consensus derived from FULL labeller coverage.
  #
  # A coverage-closure run gave a second independent judgement to the 314 events
  # that previously carried only one, so 337 of the 532 cleaned events now have
  # two genuine independent judgements (251 unanimous, 86 split) instead of an
  # unverifiable single call. 195 events still have a single judgement and are
  # kept at weight 1: we have no evidence about their reliability, so they are
  # neither promoted nor punished.
  #
  # Cross-family agreement is stable and reproducible at ~74.5%: 251/337 = 74.5%
  # on the doubled sample, and 166/223 = 74.4% on the subset that was already
  # doubled. Two independent model families agree on an IDDSI level from a web
  # photograph about three times in four.
  #
  # Agreement weighting was tried and ABANDONED ON EVIDENCE: normalising
  # agreement within each level produced a replication factor of 1 for every
  # event, because agreement is effectively all-or-nothing inside a level rather
  # than graded. The manifest carries the agreement fields for provenance but
  # applies no replication. The improvement here is the labels themselves.
  #
  # Split is inherited verbatim from v0.3 (group-disjoint, asserted), so v0.7 is
  # comparable with v0.4/v0.5 on the same held-out events.
  manifest: /work/data/manifest_v07_weighted.jsonl
  image_size: 224
  batch_size: 32
  num_workers: 8
  group_field: group_id      # 650 groups over 684 rows, asserted group-disjoint
  synthetic: false

  # ---- augmentation (the only experimental change in this lane) -------------
  # v0.7 as shipped trains on a random horizontal flip (p=0.5) and nothing
  # else: see build_transform() in trainer/train/data.py. This block turns on
  # the stronger food-photo pipeline in trainer/train/augment.py, which runs in
  # PIL space BEFORE the SigLIP-2 image processor, so resize and normalisation
  # are unchanged from the baseline. Val/test splits are never augmented.
  #
  # Why these magnitudes:
  #   crop_scale (0.55, 1.0) — web food photos are framed tightly on the plate;
  #     forcing the model to recognise a level from a partial plate is the
  #     realistic nuisance, and 0.55 is far milder than the ImageNet default
  #     of 0.08. Aspect stays in the usual 3/4..4/3 band.
  #   brightness/contrast 0.30, saturation 0.35, hue 0.05 — exposure and white
  #     balance vary enormously between phone, restaurant and stock photos.
  #     Hue is capped at 5% of the colour circle because hue and saturation
  #     carry genuine signal about the food and the level labels depend on it.
  #   blur_p 0.15 / radius 1.5 — a small share of shots are simply out of focus.
  #   horizontal_flip_p 0.5 — unchanged from v0.7; a plate is left/right
  #     symmetric and there is no reason to weaken a transform that is free.
  augment:
    horizontal_flip_p: 0.5
    crop_scale: [0.55, 1.0]
    crop_aspect: [0.75, 1.3333333333333333]
    brightness: 0.30
    contrast: 0.30
    saturation: 0.35
    hue: 0.05
    blur_p: 0.15
    blur_radius: 1.5

model:
  kind: siglip2
  name: /work/models_local/siglip2-base-patch16-224
  pretrained: true
  dropout: 0.1

training:
  # Identical to every prior version. Only the labels differ.
  device: cuda
  amp: true
  weight_decay: 0.01
  class_balance_beta: 0.999
  gradient_clip_norm: 1.0
  phases:
    - name: frozen_encoder_head
      epochs: 60
      lr: 0.001
      unfreeze_last_blocks: 0
    - name: unfreeze_last_two_blocks
      epochs: 15
      lr: 0.00002
      unfreeze_last_blocks: 2

calibration:
  target_under_fnr: 0.05
  max_abstention: 0.30

evaluation:
  bootstrap_samples: 1000
  bootstrap_seed: 2026
