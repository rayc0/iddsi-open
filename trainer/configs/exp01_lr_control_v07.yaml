# exp01_lr CONTROL RUN — this is the v0.7 recipe, unchanged.
#
# It exists so the learning-rate sweep can be judged inside ONE environment
# (same container, same torch build, same GPU) instead of across whatever
# machine produced results/v07_release/. Only two things differ from
# configs/siglip2_v07.yaml, and neither is a training knob:
#   * output_dir redirected into this lane's run directory
#   * seeds trimmed to [17, 101] to match the sweep's 2-seed budget
# Every data/model/training/calibration value is verbatim v0.7, including
# both phase learning rates (0.001 head-only, then 0.00002 with the last two
# encoder blocks unfrozen).
experiment:
  name: siglip2_v07_control
  output_dir: /work/lane_runs/exp01_lr/control_v07
  seeds:
  - 17
  - 101
data:
  manifest: /work/data/manifest_v07_weighted.jsonl
  image_size: 224
  batch_size: 32
  num_workers: 8
  group_field: group_id
  synthetic: false
model:
  kind: siglip2
  name: /work/models_local/siglip2-base-patch16-224
  pretrained: true
  dropout: 0.1
training:
  device: cuda
  amp: true
  weight_decay: 0.01
  class_balance_beta: 0.999
  gradient_clip_norm: 1.0
  phases:
  - name: frozen_encoder_head
    epochs: 60
    lr: 0.001
    unfreeze_last_blocks: 0
  - name: unfreeze_last_two_blocks
    epochs: 15
    lr: 2.0e-05
    unfreeze_last_blocks: 2
calibration:
  target_under_fnr: 0.05
  max_abstention: 0.3
evaluation:
  bootstrap_samples: 1000
  bootstrap_seed: 2026
